name: Temporary CRM i18n QC

on:
  push:
    branches:
      - qc/crm-launch-readiness
    paths:
      - '.github/workflows/tmp-crm-i18n-qc.yml'

permissions:
  contents: write

jobs:
  qc:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install catalog tooling
        run: |
          python -m pip install --disable-pip-version-check polib deep-translator
          sudo apt-get update -qq && sudo apt-get install -y gettext
      - name: Build six launch catalogs
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/build_crm_catalogs.py <<'PY'
          import re
          import time
          from pathlib import Path
          import polib
          from deep_translator import GoogleTranslator

          pot = polib.pofile('languages/core-blueprint-crm.pot')
          entries = [entry for entry in pot if entry.msgid and not entry.obsolete]
          locales = {
              'nl_NL': ('nl', 'nplurals=2; plural=(n != 1);'),
              'de_DE': ('de', 'nplurals=2; plural=(n != 1);'),
              'fr_FR': ('fr', 'nplurals=2; plural=(n > 1);'),
              'es_ES': ('es', 'nplurals=2; plural=(n != 1);'),
              'it_IT': ('it', 'nplurals=2; plural=(n != 1);'),
              'pt_PT': ('pt', 'nplurals=2; plural=(n != 1);'),
          }
          token_re = re.compile(r'%(?:\d+\$)?[-+0 #]*(?:\d+)?(?:\.\d+)?[bcdeEfFgGosuxX]|\{[A-Za-z0-9_.-]+\}|<[^>]+>')
          printf_re = re.compile(r'%(?:\d+\$)?[-+0 #]*(?:\d+)?(?:\.\d+)?[bcdeEfFgGosuxX]')
          brace_re = re.compile(r'\{[A-Za-z0-9_.-]+\}')
          sep = ' CBSEPARATOR2026KEEP '

          def translate_plain(translator, text):
              if not text or not text.strip():
                  return text
              last = None
              for attempt in range(3):
                  try:
                      result = translator.translate(text)
                      return result if result else text
                  except Exception as exc:
                      last = exc
                      if 'No translation was found using the current translator' in str(exc):
                          return text
                      time.sleep(1 + attempt)
              raise RuntimeError(f'translation failed: {last}')

          def protected_translate(translator, source):
              matches = list(token_re.finditer(source))
              if not matches:
                  return translate_plain(translator, source)
              out, pos = [], 0
              for match in matches:
                  out.append(translate_plain(translator, source[pos:match.start()]))
                  out.append(match.group(0))
                  pos = match.end()
              out.append(translate_plain(translator, source[pos:]))
              return ''.join(out)

          def signature(text):
              return (printf_re.findall(text), brace_re.findall(text))

          unique, seen = [], set()
          for entry in entries:
              for value in (entry.msgid, entry.msgid_plural):
                  if value and value not in seen:
                      seen.add(value)
                      unique.append(value)

          for locale, (target, plural_forms) in locales.items():
              translator = GoogleTranslator(source='en', target=target)
              translated = {}
              plain = [value for value in unique if not token_re.search(value)]
              protected = [value for value in unique if token_re.search(value)]
              batches, batch, chars = [], [], 0
              for value in plain:
                  projected = chars + len(value) + len(sep)
                  if batch and projected > 2200:
                      batches.append(batch)
                      batch, chars = [], 0
                  batch.append(value)
                  chars += len(value) + len(sep)
              if batch:
                  batches.append(batch)
              for group in batches:
                  joined = sep.join(group)
                  try:
                      parts = translate_plain(translator, joined).split(sep)
                  except Exception:
                      parts = []
                  if len(parts) != len(group):
                      parts = [translate_plain(translator, value) for value in group]
                  for source, value in zip(group, parts):
                      translated[source] = value.strip()
              for source in protected:
                  value = protected_translate(translator, source)
                  if signature(source) != signature(value):
                      raise RuntimeError(f'{locale}: protected token mismatch: {source!r} -> {value!r}')
                  translated[source] = value

              po = polib.POFile()
              po.metadata = {
                  'Project-Id-Version': 'Core Blueprint CRM 1.0.0-rc1',
                  'PO-Revision-Date': time.strftime('%Y-%m-%d %H:%M+0000', time.gmtime()),
                  'Last-Translator': 'Core Blueprint',
                  'Language-Team': locale,
                  'Language': locale,
                  'MIME-Version': '1.0',
                  'Content-Type': 'text/plain; charset=UTF-8',
                  'Content-Transfer-Encoding': '8bit',
                  'Plural-Forms': plural_forms,
              }
              for src in entries:
                  entry = polib.POEntry(msgid=src.msgid, msgctxt=src.msgctxt, occurrences=list(src.occurrences), comment=src.comment, tcomment=src.tcomment, flags=list(src.flags))
                  if src.msgid_plural:
                      entry.msgid_plural = src.msgid_plural
                      entry.msgstr_plural[0] = translated[src.msgid]
                      entry.msgstr_plural[1] = translated[src.msgid_plural]
                  else:
                      entry.msgstr = translated[src.msgid]
                  po.append(entry)
              po_path = Path('languages') / f'core-blueprint-crm-{locale}.po'
              mo_path = Path('languages') / f'core-blueprint-crm-{locale}.mo'
              po.save(str(po_path))
              po.save_as_mofile(str(mo_path))
              print(f'{locale}_ENTRIES={len(entries)}')
          PY
          python /tmp/build_crm_catalogs.py
          for locale in nl_NL de_DE fr_FR es_ES it_IT pt_PT; do
            po="languages/core-blueprint-crm-${locale}.po"
            mo="languages/core-blueprint-crm-${locale}.mo"
            test -s "$po" && test -s "$mo"
            msgfmt --check --check-format -o "/tmp/${locale}.mo" "$po"
            missing=$(msgattrib --untranslated "$po" | grep -c '^msgid ' || true)
            echo "${locale}_UNTRANSLATED=${missing}"
            test "$missing" -eq 0
          done
      - name: Contract sanity
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/crm-php-lint.log
          if grep -q 'CB_CRM_REQUIRED_BASE' core-blueprint-crm.php src/Integration/Suite.php; then exit 1; fi
          if grep -q "'requires_base'" src/Integration/Suite.php; then exit 1; fi
          grep -q 'Governance\\Audit' src/Governance.php
          grep -q 'EventRegistry::register' src/Governance.php
      - name: Commit catalogs
        shell: bash
        run: |
          git config user.name 'Core Blueprint CI'
          git config user.email 'actions@users.noreply.github.com'
          git add languages/
          git diff --cached --check
          git commit -m 'Add CRM launch translation catalogs'
          git push origin HEAD:qc/crm-launch-readiness
